packages:
  - "."
# Hostinger can invoke a different pnpm patch through Corepack during builds.
# Keep the lockfile and package pin, but allow that runner with a warning.
pmOnFail: warn
# Hosted builds cannot answer interactive prompts after dependency staging.
confirmModulesPurge: false
# Use real package directories so the hosting runtime can relocate dependencies.
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - postcss@8.5.26
  - '@next/env@16.4.3'
  - '@next/eslint-plugin-next@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - eslint-config-next@16.4.3
  - next@16.4.3
  - decode-uri-component@0.5.1
overrides:
  # Security fixes: preserve each dependency's major version and prevent old
  # transitive pins from reinstalling vulnerable packages on hosted builds.
  "vite@>=7.0.0 <=7.3.4": ">=7.3.6"
  "vite@>=8.0.0 <8.2.4": "8.2.4"
  "brace-expansion@>=1.0.0 <1.1.21": "1.1.21"
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "nanoid@>=3.0.0 <3.3.18": "3.3.19"
  "browserslist@>=4.0.0 <4.28.7": "4.28.7"
  "@humanfs/node@>=0.16.0 <0.16.8": "0.16.8"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "sharp@>=0.35.0 <0.35.5": "0.35.5"
  "decode-uri-component@<0.5.1": "0.5.1"
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
